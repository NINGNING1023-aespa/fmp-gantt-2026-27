 for(let d=START;d<=END;){const date=new Date(d),next=Date.UTC(date.getUTCFullYear(),date.getUTCMonth()+1,1),stop=Math.min(next,END+MS);const width=(stop-d)/MS*dayWidth;const month=state.fit?new Intl.DateTimeFormat(state.lang==='zh'?'zh-CN':'en-GB',{month:'short',timeZone:'UTC'}).format(date):t('months')[date.getUTCMonth()];html+=`<div class="month" style="left:${(d-START)/MS*dayWidth}px;width:${width}px">${esc(month)}${width>70?' '+date.getUTCFullYear():''}</div>`;d=next;}
 if(state.zoom==='day'&&!state.fit){for(let i=0;i<DAYS;i++){const ms=START+i*MS,s=iso(ms),dt=new Date(ms);const weekday=new Intl.DateTimeFormat(state.lang==='zh'?'zh-CN':'en-GB',{weekday:'narrow',timeZone:'UTC'}).format(dt);html+=`<div class="tick" style="left:${i*dayWidth}px;width:${dayWidth}px"><b>${dt.getUTCDate()}</b>${esc(weekday)}</div>`;}}
 else{for(let i=0;i<DAYS;i+=7){const s=iso(START+i*MS),wk=DATA.weeks[s],width=Math.min(7,DAYS-i)*dayWidth;const breakClass=DATA.breaks.some(b=>s>=b.start&&s<=b.finish)?' break-tick':'';const label=wk?'W'+wk:t('gap');const canLabel=width>48||(!state.fit&&width>35);html+=`<div class="tick${breakClass}" style="left:${i*dayWidth}px;width:${width}px">${canLabel?`<b>${esc(label)}</b>${esc(shortDate(s))}`:''}</div>`;}}
 html+='<div class="milestone-rail">';DATA.milestones.forEach((m,i)=>{const x=(offset(m.date)+.5)*dayWidth;html+=`<button onclick="FMP.handleClick(event)" class="milestone-pin${i===DATA.milestones.length-1?' end-pin':''}" data-milestone="${m.id}" style="left:${x}px" title="${esc(fmt(m.date,true)+' · '+bi(m.name))}" aria-label="${esc(bi(m.name)+', '+fmt(m.date,true))}"><i class="diamond" aria-hidden="true"></i>${state.fit?'':m.week}</button>`});return html+'</div>';
}
function bands(){let html=DATA.breaks.map(b=>`<span class="break-band" style="left:${offset(b.start)*dayWidth}px;width:${(offset(b.finish)-offset(b.start)+1)*dayWidth}px"></span>`).join('');if(state.zoom==='day'&&!state.fit){for(let i=0;i<DAYS;i++){if([0,6].includes(new Date(START+i*MS).getUTCDay()))html+=`<span class="weekend-band" style="left:${i*dayWidth}px;width:${dayWidth}px"></span>`;}}const today=offset(todayISO());if(today>=0&&today<DAYS)html+=`<span class="today-line" style="left:${(today+.5)*dayWidth}px"></span>`;return html;}
function renderTable(){
 calculateScale();
 $('tableHead').innerHTML=`<tr><th scope="col" class="frozen f-id">${esc(t('id'))}</th><th scope="col" class="frozen f-task">${esc(t('task'))}</th><th scope="col" class="frozen f-start">${esc(t('start'))}</th><th scope="col" class="frozen f-finish">${esc(t('finish'))}</th><th scope="col" class="frozen f-progress">${esc(t('progress'))}</th><th scope="col" class="axishead"><span class="sr-only">${esc(t('schedule'))}</span><div class="axis">${axisHTML()}</div></th></tr>`;
 const band=bands();let html='';
 DATA.streams.forEach(s=>{
  const tasks=visible().filter(x=>x.id[0]===s.code).sort((a,b)=>a.start.localeCompare(b.start)||a.id.localeCompare(b.id));if(!tasks.length)return;
  const earliest=Math.min(...tasks.map(x=>offset(x.start))),latest=Math.max(...tasks.map(x=>offset(x.finish)));
  html+=`<tr class="group-row"><th class="group-span" colspan="5" scope="rowgroup"><div class="group-label" style="--stream:${color(s.code)}"><i class="stream-dot" aria-hidden="true"></i>${esc(bi(s.name))}<button onclick="FMP.handleClick(event)" class="group-detail-button" data-workstream="${s.code}" aria-label="${esc(t('showDetail')+': '+bi(s.name))}" aria-controls="drawer" aria-expanded="${state.drawer==='workstream'&&state.workstream===s.code}">${esc(t('showDetail'))}</button><span class="group-count">${tasks.length} ${esc(t('count'))}</span></div></th><td class="timeline-cell group-timeline" style="--stream:${color(s.code)}"><span class="group-summary" style="left:${earliest*dayWidth}px;width:${(latest-earliest+1)*dayWidth}px"></span></td></tr>`;
  tasks.forEach(x=>{const name=taskText(x),w=Number(x.days)*dayWidth,confirmed=DATA.confirmed.includes(x.id);html+=`<tr class="task-row${state.selected===x.id?' selected':''}" data-row="${x.id}" style="--stream:${color(s.code)}"><td class="frozen f-id">${x.id}</td><th scope="row" class="frozen f-task"><button onclick="FMP.handleClick(event)" class="task-button" data-task="${x.id}" aria-expanded="${state.selected===x.id&&state.drawer==='task'}" aria-controls="drawer" title="${esc(name)}"><span class="task-name">${esc(name)}</span></button></th><td class="frozen f-start date">${esc(shortDate(x.start))}</td><td class="frozen f-finish date">${esc(shortDate(x.finish))}</td><td class="frozen f-progress"><span class="progress-label">${esc(confirmed?t('confirmed'):t('pending'))}</span><div class="progress-track" aria-hidden="true"></div></td><td class="timeline-cell">${band}<button onclick="FMP.handleClick(event)" class="task-bar" data-task="${x.id}" style="left:${offset(x.start)*dayWidth}px;width:${w}px" title="${esc(x.id+' · '+name+' · '+fmt(x.start,true)+' – '+fmt(x.finish,true))}" aria-label="${esc(t('showTask')+' '+x.id+': '+name)}" aria-controls="drawer" aria-expanded="${state.selected===x.id&&state.drawer==='task'}">${w>65?x.id:''}</button></td></tr>`;});
 });
 $('tableBody').innerHTML=html;requestAnimationFrame(drawDependencies);
}
function drawDependencies(){
 const svg=$('dependencyLines');svg.innerHTML='';document.querySelectorAll('.task-row.related').forEach(row=>row.classList.remove('related'));svg.style.height=$('ganttTable').offsetHeight+'px';if(!state.selected||state.drawer!=='task')return;
 const selected=taskById(state.selected);const edges=[];selected.deps.forEach(id=>edges.push([id,selected.id]));DATA.tasks.filter(x=>x.deps.includes(selected.id)).forEach(x=>edges.push([selected.id,x.id]));
 let paths='';const related=new Set();
 edges.forEach(([from,to])=>{const a=taskById(from),b=taskById(to),ra=document.querySelector(`[data-row="${from}"]`),rb=document.querySelector(`[data-row="${to}"]`);related.add(from);related.add(to);if(!a||!b||!ra||!rb)return;const x1=(offset(a.finish)+1)*dayWidth+2,x2=offset(b.start)*dayWidth-3,y1=ra.offsetTop+ra.offsetHeight/2,y2=rb.offsetTop+rb.offsetHeight/2;const bend=Math.max(x1,x2)+18;paths+=`<path d="M${x1},${y1} C${bend},${y1} ${bend},${y2} ${x2},${y2}" fill="none" stroke="${state.theme==='dark'?'#D2D5DF':'#646A79'}" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#linkArrow)"/>`;});
 svg.innerHTML=`<defs><marker id="linkArrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6Z" fill="${state.theme==='dark'?'#D2D5DF':'#646A79'}"/></marker></defs>`+paths;
 document.querySelectorAll('[data-row]').forEach(row=>row.classList.toggle('related',related.has(row.dataset.row)&&row.dataset.row!==state.selected));
}
function depButtons(ids){return ids.length?`<div class="dep-buttons">${ids.map(id=>`<button onclick="FMP.handleClick(event)" class="dep-button" data-dependency="${id}" title="${esc(taskText(taskById(id)))}">${id}</button>`).join('')}</div>`:`<p class="muted">${esc(t('none'))}</p>`;}
function showDrawer(kind,id=null,focus=true,listOrigin=null){if($('drawer').hidden)lastFocus=document.activeElement;state.drawer=kind;state.selected=kind==='task'?id:null;state.listOrigin=kind==='task'?listOrigin:null;if(kind==='workstream')state.workstream=id;$('drawer').hidden=false;renderDrawer();$('drawerContent').scrollTop=0;document.querySelectorAll('[data-row]').forEach(row=>row.classList.toggle('selected',row.dataset.row===state.selected));document.querySelectorAll('[data-task]').forEach(b=>b.setAttribute('aria-expanded',String(kind==='task'&&b.dataset.task===id)));document.querySelectorAll('.group-detail-button').forEach(b=>b.setAttribute('aria-expanded',String(kind==='workstream'&&b.dataset.workstream===id)));drawDependencies();if(focus)$('closeDrawer').focus({preventScroll:true});}
function renderDrawer(){
 if(!state.drawer)return;let html='';
 if(state.drawer==='task'){
  const x=taskById(state.selected),s=streamByCode(x.id[0]),confirmed=DATA.confirmed.includes(x.id),following=DATA.tasks.filter(z=>z.deps.includes(x.id)).map(z=>z.id);$('drawerKind').textContent=t('taskDetail');
  html=`<div class="detail-code" style="--stream:${color(s.code)}"><i class="stream-dot" aria-hidden="true"></i>${x.id} · ${esc(bi(s.name))}</div><h2 id="drawerTitle" tabindex="-1">${esc(taskText(x))}</h2><dl class="detail-dates"><div><dt>${esc(t('start'))}</dt><dd>${esc(fmt(x.start,true))}</dd></div><div><dt>${esc(t('finish'))}</dt><dd>${esc(fmt(x.finish,true))}</dd></div><div><dt>${esc(t('duration'))}</dt><dd>${x.days} ${esc(t('days'))}</dd></div><div><dt>${esc(t('owner'))}</dt><dd>${esc(t('student'))}</dd></div></dl><div class="status-note"><p><strong>${esc(confirmed?t('confirmed'):t('planned'))}</strong></p><p class="muted">${esc(confirmed?t('wordingNote'):t('progressNote'))}</p></div>`;
  if(x.mapping){html+=`<h3>${esc(t('objective'))}</h3><p>${esc(x.mapping.objective)}</p><h3>${esc(t('method'))}</h3><p>${esc(bi(x.mapping.method))}</p>`;}
  html+=`<h3>${esc(t('deliverable'))}</h3><p>${esc(state.lang==='zh'?x.zh[1]:x.deliverable)}</p><h3>${esc(t('notes'))}</h3><p>${esc(state.lang==='zh'?x.zh[2]:x.notes)}</p><h3>${esc(t('predecessors'))}</h3>${depButtons(x.deps)}<h3>${esc(t('successors'))}</h3>${depButtons(following)}<p class="detail-footnote">${esc(t('linksNote'))}</p>`;
 }else if(state.drawer==='workstream'){
  const stream=streamByCode(state.workstream),tasks=DATA.tasks.filter(x=>x.id[0]===stream.code).sort((a,b)=>a.start.localeCompare(b.start)||a.id.localeCompare(b.id));
  $('drawerKind').textContent=t('workstreamTasks');
  html=`<div class="detail-code" style="--stream:${color(stream.code)}"><i class="stream-dot" aria-hidden="true"></i>${stream.code} · ${tasks.length} ${esc(t('count'))}</div><h2 id="drawerTitle" tabindex="-1">${esc(bi(stream.name))}</h2><p class="muted workstream-list-hint">${esc(t('listHint'))}</p><ol class="workstream-task-list">${tasks.map(x=>`<li><button onclick="FMP.handleClick(event)" class="workstream-task-button" data-list-task="${x.id}"><span class="list-task-id" style="--stream:${color(stream.code)}">${x.id}</span><span class="list-task-name">${esc(taskText(x))}</span><span class="list-task-dates">${esc(fmt(x.start,true))} – ${esc(fmt(x.finish,true))}</span></button></li>`).join('')}</ol>`;
 }else if(state.drawer==='framework'){
  $('drawerKind').textContent=t('frameKind');html=`<h2 id="drawerTitle" tabindex="-1">${esc(t('topic'))}</h2><p class="reference-label">${esc(t('translation'))}</p><div class="status-note"><p>${esc(t('frameworkStatus'))}</p></div><h3>${esc(t('question'))}</h3><p>${esc(bi(DATA.framework.question))}</p><h3>${esc(t('aim'))}</h3><p>${esc(bi(DATA.framework.aim))}</p>`;
  DATA.framework.objectives.forEach((o,i)=>{html+=`<section class="objective"><h3>O${i+1} · ${esc(bi(o.title))}</h3><p>${esc(bi(o.text))}</p><p class="methods">${o.methods.map(m=>esc(bi(m))).join('<br>')}</p></section>`});
  html+=`<h3>${esc(t('snapshot'))}</h3><p>${esc(t('context'))}</p><h3>${esc(t('limits'))}</h3><ul>${DATA.requirements.map(r=>`<li>${esc(bi(r))}</li>`).join('')}</ul>`;
 }else{
  $('drawerKind').textContent=t('checkpointKind');html=`<h2 id="drawerTitle" tabindex="-1">${esc(t('checkpoints'))}</h2><p class="muted">${esc(t('milestoneNote'))}</p>`;
  DATA.milestones.forEach(m=>{html+=`<section class="checkpoint"><time datetime="${m.date}">${m.week} · ${esc(fmt(m.date,true))}${m.id==='M06'?' · 15:00 UK':''}</time><button onclick="FMP.handleClick(event)" data-jump="${m.date}" title="${esc(t('jump'))}">${esc(bi(m.name))}</button>${m.id==='M02'?`<p>${esc(t('interim'))}</p>`:''}</section>`});
  html+=`<p class="detail-footnote">${esc(t('deadlineNote'))}</p><h3>${esc(t('break'))}</h3><p class="muted">${esc(t('breakNote'))}</p>`;
 }
 if(state.drawer==='task'&&state.listOrigin){html=`<button onclick="FMP.handleClick(event)" class="back-to-list" data-workstream="${state.listOrigin}">${esc(t('backToList'))} · ${esc(bi(streamByCode(state.listOrigin).name))}</button>`+html;}
 $('drawerContent').innerHTML=html;
}
function closeDrawer(){state.drawer=null;state.selected=null;state.listOrigin=null;$('drawer').hidden=true;$('drawerContent').innerHTML='';document.querySelectorAll('.selected,.related').forEach(el=>el.classList.remove('selected','related'));document.querySelectorAll('[data-task],.group-detail-button').forEach(b=>b.setAttribute('aria-expanded','false'));drawDependencies();if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});}
function render(){renderShell();renderTable();if(state.drawer)renderDrawer();}
function jumpDate(s){const sc=$('ganttScroll');const left=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--left'));const viewport=Math.max(20,sc.clientWidth-left);sc.scrollLeft=Math.max(0,(offset(s)+.5)*dayWidth-viewport/2);}
function setZoom(zoom,fit=false){const sc=$('ganttScroll'),old=dayWidth,center=(sc.scrollLeft+Math.max(0,sc.clientWidth-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--left')))/2)/old;state.zoom=zoom;state.fit=fit;render();sc.scrollLeft=fit?0:Math.max(0,center*dayWidth-(sc.clientWidth-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--left')))/2);}
function handleClick(e){
 const button=e.target.closest('button');if(!button||button.disabled)return;
 const actions={themeToggle:()=>{state.theme=state.theme==='dark'?'light':'dark';save();render()},frameworkButton:()=>showDrawer('framework'),checkpointsButton:()=>showDrawer('checkpoints'),closeDrawer,todayButton:()=>{if(state.fit)setZoom('week',false);jumpDate(iso(Math.max(START,Math.min(END,parse(todayISO())))));$('announcement').textContent=t('today')+': '+fmt(todayISO(),true)},fitButton:()=>setZoom('week',!state.fit),resetButton:()=>{state.filter='all';closeDrawer();render()}};
 if(actions[button.id]){actions[button.id]();return;}
 const lang=e.target.closest('[data-lang]');if(lang){state.lang=lang.dataset.lang;save();render();return;}
 const zoom=e.target.closest('[data-zoom]');if(zoom){setZoom(zoom.dataset.zoom);return;}
 const filter=e.target.closest('[data-filter]');if(filter){applyWorkstream(filter.dataset.filter);return;}
 const workstream=e.target.closest('[data-workstream]');if(workstream){showDrawer('workstream',workstream.dataset.workstream);return;}
 const listTask=e.target.closest('[data-list-task]');if(listTask){showDrawer('task',listTask.dataset.listTask,true,state.workstream);return;}
 const task=e.target.closest('[data-task]');if(task){showDrawer('task',task.dataset.task);return;}
 const dep=e.target.closest('[data-dependency]');if(dep){const id=dep.dataset.dependency;if(state.filter!=='all'&&id[0]!==state.filter){state.filter='all';render();}showDrawer('task',id);const row=document.querySelector(`[data-row="${id}"]`);if(row){$('ganttScroll').scrollTop=Math.max(0,row.offsetTop-140);jumpDate(taskById(id).start)}return;}
 const mark=e.target.closest('[data-milestone]');if(mark){showDrawer('checkpoints');return;}
 const jump=e.target.closest('[data-jump]');if(jump){const date=jump.dataset.jump;closeDrawer();if(state.fit)setZoom('week',false);jumpDate(date);return;}
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.drawer){e.preventDefault();closeDrawer()}});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{renderTable();positionFilterSelection();},100)});
window.FMP=Object.freeze({handleClick});
render();
installFilterGestures();
})();
</script>
</body></html>
